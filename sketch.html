<!doctype html>
<html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人轨迹标点</title>
<style>
body{font:16px system-ui;background:#f4f6f8;color:#17212d;margin:24px auto;max-width:1100px;padding:0 16px}h1{font-size:24px}main{background:white;padding:20px;border-radius:12px}label{display:inline-flex;gap:8px;align-items:center;margin:8px 14px 8px 0}input,select,button{font:inherit;padding:7px;border:1px solid #c5ced8;border-radius:6px}button{cursor:pointer;background:#e8f1ff}canvas{max-width:100%;height:auto;border:1px solid #b8c4d0;touch-action:none;display:block;margin:16px 0;background:#f7f9fb}#status{color:#344861}p{line-height:1.5}.hint{font-size:14px;color:#526274}
</style>
<main><h1>在当前相机图像上画出操作轨迹</h1>
<p>导入原始观察图，拖动画线或逐点点击。标点按时间顺序保存；可给下一段设置高度和开合爪事件。</p>
<label>原始图像<input id="file" type="file" accept="image/png,image/jpeg"></label>
<label>观察编号<input id="observation" placeholder="例如 000000" required></label>
<label>相机<select id="camera"><option>head</option><option>left_wrist</option><option>right_wrist</option></select></label>
<label>手臂<select id="arm"><option>right</option><option>left</option></select></label><br>
<label>这些点表示<select id="meaning"><option value="unspecified">尚未指定</option><option value="gripper_tcp">夹爪中心经过的位置</option><option value="object_reference_point">物体经过的位置</option></select></label><br>
<label>下一段夹爪<select id="gripper"><option value="keep">保持</option><option value="open">打开</option><option value="close">闭合</option></select></label>
<label>世界高度（米，可留空）<input id="height" type="number" step="0.001" placeholder="未指定"></label>
<button id="undo">撤销一点</button> <button id="clear">清空</button> <button id="export">导出轨迹 JSON</button>
<canvas id="canvas" width="960" height="540"></canvas>
<div id="status" role="status">尚未导入图像。</div>
<p class="hint">留空高度会保留二维轨迹，不推断深度。图像哈希、原始分辨率、观察编号、相机及手臂随轨迹导出。</p>
</main>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let image=null,source=null,points=[],drawing=false,last=null;
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);if(image)ctx.drawImage(image,0,0);ctx.lineWidth=Math.max(2,canvas.width/450);ctx.strokeStyle='#df3c55';ctx.fillStyle='#df3c55';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();points.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,Math.max(3,canvas.width/220),0,Math.PI*2);ctx.fill();ctx.font=`${Math.max(12,canvas.width/70)}px system-ui`;ctx.fillText(String(i+1),p.x+8,p.y-8)});$('status').textContent=source?`${source.width} × ${source.height} · ${points.length} 个标点`:'尚未导入图像。'}
$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const bytes=await file.arrayBuffer();if(!crypto.subtle){alert('浏览器不支持图像哈希，请通过 localhost 或安全上下文打开。');return}const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');const url=URL.createObjectURL(file);const loaded=new Image();loaded.onload=()=>{image=loaded;canvas.width=loaded.naturalWidth;canvas.height=loaded.naturalHeight;source={name:file.name,file_sha256:hash,width:canvas.width,height:canvas.height};points=[];URL.revokeObjectURL(url);render()};loaded.src=url};
function add(e,force=false){if(!image)return;const rect=canvas.getBoundingClientRect(),x=Math.min(canvas.width-1,Math.max(0,(e.clientX-rect.left)*canvas.width/rect.width)),y=Math.min(canvas.height-1,Math.max(0,(e.clientY-rect.top)*canvas.height/rect.height));if(!force&&last&&Math.hypot(x-last.x,y-last.y)<Math.max(4,canvas.width/100))return;const text=$('height').value;const height=text===''?null:Number(text);if(height!==null&&!Number.isFinite(height)){alert('高度须为有限数值。');return}const point={x:Math.round(x*100)/100,y:Math.round(y*100)/100,gripper:$('gripper').value,world_height_m:height};points.push(point);last=point;render()}
canvas.onpointerdown=e=>{drawing=true;last=null;canvas.setPointerCapture(e.pointerId);add(e,true)};canvas.onpointermove=e=>{if(drawing)add(e)};canvas.onpointerup=e=>{drawing=false;canvas.releasePointerCapture(e.pointerId)};canvas.onpointercancel=()=>{drawing=false};
$('undo').onclick=()=>{points.pop();render()};$('clear').onclick=()=>{points=[];render()};
$('export').onclick=()=>{if(!source||!points.length||!$('observation').value.trim()){alert('请导入图像、填写观察编号，并画出至少一个点。');return}const data={schema:'rss-trajectory-sketch-v1',created_at:new Date().toISOString(),observation_id:$('observation').value.trim(),camera:$('camera').value,arm:$('arm').value,point_semantics:$('meaning').value,image:source,waypoints:points};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='trajectory-sketch.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
